<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prédictions Immobilières</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Prédictions Immobilières</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Sélectionner</th>
                <th>ID</th>
                <th>LotArea</th>
                <th>YearBuilt</th>
                <th>OverallQual</th>
                <th>GrLivArea</th>
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
            <tr>
                <td><input type="checkbox" class="row-select" data-id="{{ row.Id }}" 
                    data-lotarea="{{ row.LotArea }}" 
                    data-yearbuilt="{{ row.YearBuilt }}" 
                    data-overallqual="{{ row.OverallQual }}" 
                    data-grlivarea="{{ row.GrLivArea }}"></td>
                <td>{{ row.Id }}</td>
                <td>{{ row.LotArea }}</td>
                <td>{{ row.YearBuilt }}</td>
                <td>{{ row.OverallQual }}</td>
                <td>{{ row.GrLivArea }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <button id="predict-btn">Prédire</button>
    <h2>Résultats des prédictions</h2>
    <ul id="prediction-results"></ul>

    <script>
        $(document).ready(function() {
            $("#predict-btn").click(function() {
                let selectedRows = [];
                $(".row-select:checked").each(function() {
                    selectedRows.push({
                        Id: $(this).data("id"),
                        LotArea: $(this).data("lotarea"),
                        YearBuilt: $(this).data("yearbuilt"),
                        OverallQual: $(this).data("overallqual"),
                        GrLivArea: $(this).data("grlivarea")
                    });
                });

                $.ajax({
                    url: '/predict',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ selected_rows: selectedRows }),
                    success: function(response) {
                        $("#prediction-results").empty();
                        response.results.forEach(result => {
                            $("#prediction-results").append(`<li>ID: ${result.Id}, Prix Prédit: ${result.SalePrice}</li>`);
                        });
                    },
                    error: function(xhr) {
                        alert("Erreur: " + xhr.responseJSON.error);
                    }
                });
            });
        });
    </script>
</body>
</html>
